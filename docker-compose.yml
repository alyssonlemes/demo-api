name: demo

services:
  postgres:
    image: postgres:16-alpine
    container_name: demo-api-postgres
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: demo_api
    volumes:
      - demo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d demo_api"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  demo_pg_data:
